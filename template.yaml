AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Smart Employee Onboarding & Identity Service
  Phase 0, Phase 1 & Phase 2 — Core Infrastructure, Storage, Cognito Identity,
  DynamoDB EmployeeProfile, API Gateway (/employees, /onboarding/{employee_id}/status),
  AWS Step Functions Multi-Stage Workflow Engine, Reminder Mechanism, and least-privilege Lambda functions.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment stage (e.g., dev, staging, prod)

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        STAGE: !Ref Stage
        EMPLOYEE_TABLE_NAME: !Ref EmployeeProfileTable
        DOCUMENTS_BUCKET_NAME: !Ref DocumentsBucket
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:

  # ===========================================================================
  # API GATEWAY
  # ===========================================================================
  OnboardingApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "onboarding-api-${Stage}"
      StageName: !Ref Stage
      # Phase 5: Cognito authorizer — protects POST /employees, GET /onboarding/{id}/status,
      # and POST /documents/upload-url. HR admins must have a Cognito account in this pool.
      # Lambda-level role-based enforcement (HR vs. Employee) can be added in a future phase.
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
        # Keep OPTIONS (preflight) unauthenticated so browsers can call CORS checks without a token
        AddDefaultAuthorizerToCorsPreflight: false
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      GatewayResponses:
        UNAUTHORIZED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  # ===========================================================================
  # S3 STORAGE
  # ===========================================================================
  # Private documents bucket (SSE-S3 encrypted, Versioning on)
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "onboarding-documents-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Phase 5: CORS for browser-based presigned PUT uploads from the frontend S3 website.
      # Bucket remains PRIVATE — CORS only governs browser preflight validation.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedOrigins:
              - !Sub "http://onboarding-frontend-${Stage}-${AWS::AccountId}.s3-website.ap-south-1.amazonaws.com"
            AllowedHeaders:
              - "*"
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTlsRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub "arn:aws:s3:::${DocumentsBucket}"
              - !Sub "arn:aws:s3:::${DocumentsBucket}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Frontend static website hosting bucket
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "onboarding-frontend-${Stage}-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForStaticWebsite
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"

  # ===========================================================================
  # DYNAMODB TABLE
  # ===========================================================================
  EmployeeProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "onboarding-employee-profile-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: employee_id
          AttributeType: S
      KeySchema:
        - AttributeName: employee_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  # ===========================================================================
  # SNS NOTIFICATION TOPIC (Phase 3)
  # ===========================================================================
  OnboardingNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "onboarding-hr-notifications-${Stage}"
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  # ===========================================================================
  # COGNITO USER POOL & APP CLIENT (Phase 1)
  # ===========================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "onboarding-user-pool-${Stage}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: employee_id
          AttributeDataType: String
          DeveloperOnlyAttribute: false
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "256"
        - Name: role
          AttributeDataType: String
          DeveloperOnlyAttribute: false
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "256"
        - Name: department
          AttributeDataType: String
          DeveloperOnlyAttribute: false
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "256"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: "Welcome to the Team — Set up your account"
          EmailMessage: >
            Welcome to the team! Your employee onboarding account has been created.<br/><br/>
            Username: {username}<br/>
            Temporary Password: {####}<br/><br/>
            Please log in to the onboarding portal to complete your onboarding process.
      UserPoolTags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "onboarding-frontend-client-${Stage}"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO

  # ===========================================================================
  # IAM EXECUTION ROLES (Least-privilege per function)
  # ===========================================================================
  PlaceholderFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-placeholder-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-placeholder-${Stage}:*"
        - PolicyName: DynamoDBScopedAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource: !GetAtt EmployeeProfileTable.Arn
        - PolicyName: S3DocumentsScopedAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${DocumentsBucket.Arn}/*"
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  CreateEmployeeProfileFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-create-employee-profile-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-create-employee-profile-${Stage}:*"
        - PolicyName: DynamoDBCreateProfilePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt EmployeeProfileTable.Arn
        - PolicyName: InvokeProvisionUserPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:onboarding-provision-cognito-user-${Stage}"
        # Phase 5: permission to start the Step Functions onboarding state machine
        - PolicyName: StartOnboardingStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref OnboardingStateMachine
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  ProvisionCognitoUserFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-provision-cognito-user-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-provision-cognito-user-${Stage}:*"
        - PolicyName: CognitoAdminCreateUserPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminUpdateUserAttributes
                Resource: !GetAtt CognitoUserPool.Arn
        - PolicyName: DynamoDBUpdateCognitoSubPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt EmployeeProfileTable.Arn
        - PolicyName: SESOptionalWelcomeEmailPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  # Phase 2 Stage Lambda Roles
  StageDocumentCollectionFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-stage-doc-coll-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-stage-document-collection-${Stage}:*"
        - PolicyName: DynamoDBStageUpdatePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt EmployeeProfileTable.Arn
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  StageITProvisioningFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-stage-it-prov-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-stage-it-provisioning-${Stage}:*"
        - PolicyName: DynamoDBStageUpdatePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt EmployeeProfileTable.Arn
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  StagePolicySignOffFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-stage-policy-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-stage-policy-signoff-${Stage}:*"
        - PolicyName: DynamoDBStageUpdatePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt EmployeeProfileTable.Arn
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  StageManagerIntroFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-stage-mgr-intro-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-stage-manager-intro-${Stage}:*"
        - PolicyName: DynamoDBStageUpdatePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt EmployeeProfileTable.Arn
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  GetOnboardingStatusFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-get-status-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-get-status-${Stage}:*"
        - PolicyName: DynamoDBReadStatusPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt EmployeeProfileTable.Arn
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  # Phase 6: Least-privilege IAM role for listing/scanning employee onboarding pipeline
  ListOnboardingEmployeesFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-list-employees-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-list-employees-${Stage}:*"
        - PolicyName: DynamoDBScanEmployeesPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                Resource: !GetAtt EmployeeProfileTable.Arn
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage


  SendReminderEmailFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-send-reminder-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-send-reminder-${Stage}:*"
        - PolicyName: DynamoDBScanForRemindersPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                Resource: !GetAtt EmployeeProfileTable.Arn
        - PolicyName: SESSendReminderPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  OnboardingStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-state-machine-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeStageLambdaFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt StageDocumentCollectionFunction.Arn
                  # Phase 5: polling checker for document collection completion
                  - !GetAtt CheckDocumentCollectionFunction.Arn
                  - !GetAtt StageITProvisioningFunction.Arn
                  - !GetAtt StagePolicySignOffFunction.Arn
                  - !GetAtt StageManagerIntroFunction.Arn
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  # Phase 5: Least-privilege role for the document-collection polling checker
  CheckDocumentCollectionFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-check-doc-collection-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-check-doc-collection-${Stage}:*"
        - PolicyName: DynamoDBReadDocStatusPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt EmployeeProfileTable.Arn
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  GetUploadUrlFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-get-upload-url-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-get-upload-url-${Stage}:*"
        - PolicyName: S3PutObjectScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::onboarding-documents-${Stage}-${AWS::AccountId}/*"
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  ValidateDocumentFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-validate-doc-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-validate-document-${Stage}:*"
        - PolicyName: S3DocumentValidationScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::onboarding-documents-${Stage}-${AWS::AccountId}/documents/*"
        - PolicyName: DynamoDBDocumentUpdatePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt EmployeeProfileTable.Arn
        - PolicyName: SNSPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref OnboardingNotificationsTopic
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  # ===========================================================================
  # LAMBDA FUNCTIONS
  # ===========================================================================
  PlaceholderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-placeholder-${Stage}"
      CodeUri: backend/functions/placeholder/
      Handler: app.lambda_handler
      Role: !GetAtt PlaceholderFunctionRole.Arn
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  CreateEmployeeProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-create-employee-profile-${Stage}"
      CodeUri: backend/functions/createEmployeeProfile/
      Handler: app.lambda_handler
      Role: !GetAtt CreateEmployeeProfileFunctionRole.Arn
      Environment:
        Variables:
          PROVISION_FUNCTION_NAME: !Sub "onboarding-provision-cognito-user-${Stage}"
          # Phase 5: ARN of the Step Functions state machine to start after profile creation
          STATE_MACHINE_ARN: !Ref OnboardingStateMachine
      Events:
        CreateEmployee:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /employees
            Method: post
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  ProvisionCognitoUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-provision-cognito-user-${Stage}"
      CodeUri: backend/functions/provisionCognitoUser/
      Handler: app.lambda_handler
      Role: !GetAtt ProvisionCognitoUserFunctionRole.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  # Phase 2 Workflow Stage Functions
  StageDocumentCollectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-stage-document-collection-${Stage}"
      CodeUri: backend/functions/stageDocumentCollection/
      Handler: app.lambda_handler
      Role: !GetAtt StageDocumentCollectionFunctionRole.Arn
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  StageITProvisioningFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-stage-it-provisioning-${Stage}"
      CodeUri: backend/functions/stageITProvisioning/
      Handler: app.lambda_handler
      Role: !GetAtt StageITProvisioningFunctionRole.Arn
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  StagePolicySignOffFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-stage-policy-signoff-${Stage}"
      CodeUri: backend/functions/stagePolicySignOff/
      Handler: app.lambda_handler
      Role: !GetAtt StagePolicySignOffFunctionRole.Arn
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  StageManagerIntroFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-stage-manager-intro-${Stage}"
      CodeUri: backend/functions/stageManagerIntro/
      Handler: app.lambda_handler
      Role: !GetAtt StageManagerIntroFunctionRole.Arn
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  # Phase 5: Polling checker — invoked by the Step Functions WaitForDocuments loop
  CheckDocumentCollectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-check-doc-collection-${Stage}"
      CodeUri: backend/functions/checkDocumentCollection/
      Handler: app.lambda_handler
      Role: !GetAtt CheckDocumentCollectionFunctionRole.Arn
      Environment:
        Variables:
          EMPLOYEE_TABLE_NAME: !Ref EmployeeProfileTable
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  GetOnboardingStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-get-status-${Stage}"
      CodeUri: backend/functions/getOnboardingStatus/
      Handler: app.lambda_handler
      Role: !GetAtt GetOnboardingStatusFunctionRole.Arn
      Events:
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /onboarding/{employee_id}/status
            Method: get
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  # Phase 6: Scans and lists employee onboarding records for HR admin pipeline directory
  ListOnboardingEmployeesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-list-employees-${Stage}"
      CodeUri: backend/functions/listOnboardingEmployees/
      Handler: app.lambda_handler
      Role: !GetAtt ListOnboardingEmployeesFunctionRole.Arn
      Environment:
        Variables:
          EMPLOYEE_TABLE_NAME: !Ref EmployeeProfileTable
      Events:
        ListPipeline:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /onboarding/pipeline
            Method: get
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage


  SendReminderEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-send-reminder-${Stage}"
      CodeUri: backend/functions/sendReminderEmail/
      Handler: app.lambda_handler
      Role: !GetAtt SendReminderEmailFunctionRole.Arn
      Environment:
        Variables:
          REMINDER_THRESHOLD_HOURS: "24"
          SES_SENDER_EMAIL: "onboarding-noreply@example.com"
      Events:
        DailyReminderSchedule:
          Type: Schedule
          Properties:
            Schedule: "rate(1 day)"
            Name: !Sub "onboarding-daily-reminder-${Stage}"
            Description: "Trigger check for overdue onboarding stages"
            Enabled: true
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  # Phase 3 Document Collection Functions
  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-get-upload-url-${Stage}"
      CodeUri: backend/functions/getUploadUrl/
      Handler: app.lambda_handler
      Role: !GetAtt GetUploadUrlFunctionRole.Arn
      Events:
        PostUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /documents/upload-url
            Method: post
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  ValidateDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-validate-document-${Stage}"
      CodeUri: backend/functions/validateDocument/
      Handler: app.lambda_handler
      Role: !GetAtt ValidateDocumentFunctionRole.Arn
      Environment:
        Variables:
          DOCUMENTS_BUCKET_NAME: !Sub "onboarding-documents-${Stage}-${AWS::AccountId}"
          NOTIFICATIONS_TOPIC_ARN: !Ref OnboardingNotificationsTopic
      Events:
        DocumentUpload:
          Type: S3
          Properties:
            Bucket: !Ref DocumentsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: documents/
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  # ===========================================================================
  # STEP FUNCTIONS STATE MACHINE (Phase 2)
  # ===========================================================================
  OnboardingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "onboarding-state-machine-${Stage}"
      DefinitionUri: backend/statemachines/onboarding-state-machine.asl.json
      DefinitionSubstitutions:
        StageDocumentCollectionArn: !GetAtt StageDocumentCollectionFunction.Arn
        # Phase 5: polling checker used by WaitForDocuments loop
        CheckDocumentCollectionArn: !GetAtt CheckDocumentCollectionFunction.Arn
        StageITProvisioningArn: !GetAtt StageITProvisioningFunction.Arn
        StagePolicySignOffArn: !GetAtt StagePolicySignOffFunction.Arn
        StageManagerIntroArn: !GetAtt StageManagerIntroFunction.Arn
      Role: !GetAtt OnboardingStateMachineRole.Arn
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

# =============================================================================
# OUTPUTS
# =============================================================================
Outputs:
  DeploymentStage:
    Description: Active deployment stage
    Value: !Ref Stage

  ApiEndpoint:
    Description: Root API Gateway Endpoint URL
    Value: !Sub "https://${OnboardingApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"

  CreateEmployeeApiUrl:
    Description: Endpoint URL for POST /employees
    Value: !Sub "https://${OnboardingApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/employees"
    Export:
      Name: !Sub "${AWS::StackName}-CreateEmployeeApiUrl"

  GetOnboardingStatusApiUrl:
    Description: Endpoint URL for GET /onboarding/{employee_id}/status
    Value: !Sub "https://${OnboardingApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/onboarding/{employee_id}/status"
    Export:
      Name: !Sub "${AWS::StackName}-GetOnboardingStatusApiUrl"

  EmployeeProfileTableName:
    Description: DynamoDB Table Name for Employee Profiles
    Value: !Ref EmployeeProfileTable
    Export:
      Name: !Sub "${AWS::StackName}-EmployeeProfileTable"

  EmployeeProfileTableArn:
    Description: DynamoDB Table ARN for Employee Profiles
    Value: !GetAtt EmployeeProfileTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EmployeeProfileTableArn"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolId"

  CognitoUserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolArn"

  CognitoUserPoolClientId:
    Description: Cognito User Pool App Client ID (Frontend SPA)
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolClientId"

  DocumentsBucketName:
    Description: S3 Bucket Name for Private Document Storage
    Value: !Ref DocumentsBucket
    Export:
      Name: !Sub "${AWS::StackName}-DocumentsBucket"

  DocumentsBucketArn:
    Description: S3 Bucket ARN for Private Document Storage
    Value: !GetAtt DocumentsBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DocumentsBucketArn"

  FrontendBucketName:
    Description: S3 Bucket Name for Frontend Static Website Hosting
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${AWS::StackName}-FrontendBucket"

  FrontendWebsiteURL:
    Description: Static Website Hosting Endpoint URL
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !Sub "${AWS::StackName}-FrontendWebsiteURL"

  OnboardingStateMachineArn:
    Description: AWS Step Functions Onboarding Workflow State Machine ARN
    Value: !Ref OnboardingStateMachine
    Export:
      Name: !Sub "${AWS::StackName}-OnboardingStateMachineArn"

  CreateEmployeeProfileFunctionArn:
    Description: createEmployeeProfile Lambda Function ARN
    Value: !GetAtt CreateEmployeeProfileFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CreateEmployeeProfileFunctionArn"

  ProvisionCognitoUserFunctionArn:
    Description: provisionCognitoUser Lambda Function ARN
    Value: !GetAtt ProvisionCognitoUserFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProvisionCognitoUserFunctionArn"

  GetOnboardingStatusFunctionArn:
    Description: getOnboardingStatus Lambda Function ARN
    Value: !GetAtt GetOnboardingStatusFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GetOnboardingStatusFunctionArn"

  SendReminderEmailFunctionArn:
    Description: sendReminderEmail Lambda Function ARN
    Value: !GetAtt SendReminderEmailFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SendReminderEmailFunctionArn"

  StageDocumentCollectionFunctionArn:
    Description: stageDocumentCollection Lambda Function ARN
    Value: !GetAtt StageDocumentCollectionFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-StageDocumentCollectionFunctionArn"

  StageITProvisioningFunctionArn:
    Description: stageITProvisioning Lambda Function ARN
    Value: !GetAtt StageITProvisioningFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-StageITProvisioningFunctionArn"

  StagePolicySignOffFunctionArn:
    Description: stagePolicySignOff Lambda Function ARN
    Value: !GetAtt StagePolicySignOffFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-StagePolicySignOffFunctionArn"

  StageManagerIntroFunctionArn:
    Description: stageManagerIntro Lambda Function ARN
    Value: !GetAtt StageManagerIntroFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-StageManagerIntroFunctionArn"

  OnboardingNotificationsTopicArn:
    Description: SNS Topic ARN for HR Onboarding Notifications
    Value: !Ref OnboardingNotificationsTopic
    Export:
      Name: !Sub "${AWS::StackName}-OnboardingNotificationsTopicArn"

  GetUploadUrlApiUrl:
    Description: Endpoint URL for POST /documents/upload-url
    Value: !Sub "https://${OnboardingApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/documents/upload-url"
    Export:
      Name: !Sub "${AWS::StackName}-GetUploadUrlApiUrl"

  GetUploadUrlFunctionArn:
    Description: getUploadUrl Lambda Function ARN
    Value: !GetAtt GetUploadUrlFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GetUploadUrlFunctionArn"

  ValidateDocumentFunctionArn:
    Description: validateDocument Lambda Function ARN
    Value: !GetAtt ValidateDocumentFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ValidateDocumentFunctionArn"

  ListOnboardingEmployeesFunctionArn:
    Description: listOnboardingEmployees Lambda Function ARN
    Value: !GetAtt ListOnboardingEmployeesFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ListOnboardingEmployeesFunctionArn"

  ListPipelineApiUrl:
    Description: Endpoint URL for GET /onboarding/pipeline
    Value: !Sub "https://${OnboardingApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/onboarding/pipeline"
    Export:
      Name: !Sub "${AWS::StackName}-ListPipelineApiUrl"
