AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Smart Employee Onboarding & Identity Service
  Phase 0 & Phase 1 — Infrastructure, Storage, Cognito User Pool, DynamoDB EmployeeProfile,
  API Gateway (/employees), and least-privilege Lambda functions.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment stage (e.g., dev, staging, prod)

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        STAGE: !Ref Stage
        EMPLOYEE_TABLE_NAME: !Ref EmployeeProfileTable
        DOCUMENTS_BUCKET_NAME: !Ref DocumentsBucket
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:

  # ===========================================================================
  # API GATEWAY
  # ===========================================================================
  OnboardingApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "onboarding-api-${Stage}"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  # ===========================================================================
  # S3 STORAGE
  # ===========================================================================
  # Private documents bucket (SSE-S3 encrypted, Versioning on)
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "onboarding-documents-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceTlsRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub "arn:aws:s3:::${DocumentsBucket}"
              - !Sub "arn:aws:s3:::${DocumentsBucket}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Frontend static website hosting bucket
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "onboarding-frontend-${Stage}-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForStaticWebsite
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"

  # ===========================================================================
  # DYNAMODB TABLE
  # ===========================================================================
  EmployeeProfileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "onboarding-employee-profile-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: employee_id
          AttributeType: S
      KeySchema:
        - AttributeName: employee_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  # ===========================================================================
  # COGNITO USER POOL & APP CLIENT (Phase 1)
  # ===========================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "onboarding-user-pool-${Stage}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: employee_id
          AttributeDataType: String
          DeveloperOnlyAttribute: false
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "256"
        - Name: role
          AttributeDataType: String
          DeveloperOnlyAttribute: false
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "256"
        - Name: department
          AttributeDataType: String
          DeveloperOnlyAttribute: false
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "256"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: "Welcome to the Team — Set up your account"
          EmailMessage: >
            Welcome to the team! Your employee onboarding account has been created.<br/><br/>
            Username: {username}<br/>
            Temporary Password: {####}<br/><br/>
      UserPoolTags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "onboarding-frontend-client-${Stage}"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO

  # ===========================================================================
  # IAM EXECUTION ROLES (Least-privilege per function)
  # ===========================================================================
  PlaceholderFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-placeholder-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-placeholder-${Stage}:*"
        - PolicyName: DynamoDBScopedAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource: !GetAtt EmployeeProfileTable.Arn
        - PolicyName: S3DocumentsScopedAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${DocumentsBucket.Arn}/*"
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  CreateEmployeeProfileFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-create-employee-profile-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-create-employee-profile-${Stage}:*"
        - PolicyName: DynamoDBCreateProfilePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt EmployeeProfileTable.Arn
        - PolicyName: InvokeProvisionUserPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:onboarding-provision-cognito-user-${Stage}"
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  ProvisionCognitoUserFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "onboarding-provision-cognito-user-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsScopedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/onboarding-provision-cognito-user-${Stage}:*"
        - PolicyName: CognitoAdminCreateUserPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminUpdateUserAttributes
                Resource: !GetAtt CognitoUserPool.Arn
        - PolicyName: DynamoDBUpdateCognitoSubPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt EmployeeProfileTable.Arn
        - PolicyName: SESOptionalWelcomeEmailPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: Project
          Value: smart-employee-onboarding
        - Key: Environment
          Value: !Ref Stage

  # ===========================================================================
  # LAMBDA FUNCTIONS
  # ===========================================================================
  PlaceholderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-placeholder-${Stage}"
      CodeUri: backend/functions/placeholder/
      Handler: app.lambda_handler
      Role: !GetAtt PlaceholderFunctionRole.Arn
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  CreateEmployeeProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-create-employee-profile-${Stage}"
      CodeUri: backend/functions/createEmployeeProfile/
      Handler: app.lambda_handler
      Role: !GetAtt CreateEmployeeProfileFunctionRole.Arn
      Environment:
        Variables:
          PROVISION_FUNCTION_NAME: !Sub "onboarding-provision-cognito-user-${Stage}"
      Events:
        CreateEmployee:
          Type: Api
          Properties:
            RestApiId: !Ref OnboardingApi
            Path: /employees
            Method: post
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

  ProvisionCognitoUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "onboarding-provision-cognito-user-${Stage}"
      CodeUri: backend/functions/provisionCognitoUser/
      Handler: app.lambda_handler
      Role: !GetAtt ProvisionCognitoUserFunctionRole.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
      Tags:
        Project: smart-employee-onboarding
        Environment: !Ref Stage

# =============================================================================
# OUTPUTS
# =============================================================================
Outputs:
  DeploymentStage:
    Description: Active deployment stage
    Value: !Ref Stage

  ApiEndpoint:
    Description: Root API Gateway Endpoint URL
    Value: !Sub "https://${OnboardingApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"

  CreateEmployeeApiUrl:
    Description: Endpoint URL for POST /employees
    Value: !Sub "https://${OnboardingApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/employees"
    Export:
      Name: !Sub "${AWS::StackName}-CreateEmployeeApiUrl"

  EmployeeProfileTableName:
    Description: DynamoDB Table Name for Employee Profiles
    Value: !Ref EmployeeProfileTable
    Export:
      Name: !Sub "${AWS::StackName}-EmployeeProfileTable"

  EmployeeProfileTableArn:
    Description: DynamoDB Table ARN for Employee Profiles
    Value: !GetAtt EmployeeProfileTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EmployeeProfileTableArn"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolId"

  CognitoUserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolArn"

  CognitoUserPoolClientId:
    Description: Cognito User Pool App Client ID (Frontend SPA)
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolClientId"

  DocumentsBucketName:
    Description: S3 Bucket Name for Private Document Storage
    Value: !Ref DocumentsBucket
    Export:
      Name: !Sub "${AWS::StackName}-DocumentsBucket"

  DocumentsBucketArn:
    Description: S3 Bucket ARN for Private Document Storage
    Value: !GetAtt DocumentsBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DocumentsBucketArn"

  FrontendBucketName:
    Description: S3 Bucket Name for Frontend Static Website Hosting
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${AWS::StackName}-FrontendBucket"

  FrontendWebsiteURL:
    Description: Static Website Hosting Endpoint URL
    Value: !GetAtt FrontendBucket.WebsiteURL
    Export:
      Name: !Sub "${AWS::StackName}-FrontendWebsiteURL"

  CreateEmployeeProfileFunctionArn:
    Description: createEmployeeProfile Lambda Function ARN
    Value: !GetAtt CreateEmployeeProfileFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CreateEmployeeProfileFunctionArn"

  ProvisionCognitoUserFunctionArn:
    Description: provisionCognitoUser Lambda Function ARN
    Value: !GetAtt ProvisionCognitoUserFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProvisionCognitoUserFunctionArn"
